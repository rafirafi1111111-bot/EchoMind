name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    name: Phase 1 mesh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Phase 1 connect / signal / ack
        run: node phase1/test/verify.js

      - name: Smoke the Phase 1 demo
        run: node phase1/src/index.js

  phase2:
    name: Phase 2 realtime mock
    runs-on: ubuntu-latest
    needs: phase1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Phase 2 sync without crash
        run: node phase2/test/verify.js

  preview:
    name: Web preview assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require PWA client files
        run: |
          test -f client/index.html
          test -f client/app.js
          test -f client/styles.css
          test -f client/manifest.json
          test -f client/sw.js
          echo "PWA client present."
